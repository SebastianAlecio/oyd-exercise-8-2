name: CI

on:
  push:
    branches: [main]

# id-token: write lets the workflow request a short-lived OIDC token from GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Keyless: assume the IAM role via OIDC, no stored access keys.
          role-to-assume: arn:aws:iam::544341949288:role/oyd-exercise-8-2-ci-runner
          aws-region: us-east-1

      - name: Verify AWS identity (OIDC)
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform validate
